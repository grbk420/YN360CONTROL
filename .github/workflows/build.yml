name: Build YN360 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unseal persistent signing key
        env:
          YN360_SIGNING_PASSWORD: ${{ secrets.YN360_SIGNING_PASSWORD }}
        run: |
          test -n "$YN360_SIGNING_PASSWORD" || { echo "::error::Add the YN360_SIGNING_PASSWORD repository secret before building."; exit 1; }
          base64 --decode signing/yn360-release.p12.enc.b64 > /tmp/yn360-release.p12.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in /tmp/yn360-release.p12.enc -out /tmp/yn360-release.p12 -pass env:YN360_SIGNING_PASSWORD
          chmod 600 /tmp/yn360-release.p12
          echo "YN360_KEYSTORE_PATH=/tmp/yn360-release.p12" >> "$GITHUB_ENV"
      - name: Build stable signed release
        working-directory: source
        env:
          YN360_SIGNING_PASSWORD: ${{ secrets.YN360_SIGNING_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: YN360-Control-v1.12-final
          path: source/app/build/outputs/apk/release/app-release.apk
      - name: Publish FINAL v1.12 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp source/app/build/outputs/apk/release/app-release.apk YN360-Control-v1.12.apk
          if gh release view v1.12.0 >/dev/null 2>&1; then
            gh release upload v1.12.0 YN360-Control-v1.12.apk --clobber
          else
            gh release create v1.12.0 YN360-Control-v1.12.apk \
              --title "YN360 Control FINAL v1.12" \
              --notes "YN360 Studio 1.12: DJ Quick FX next to Drop with Strobe, Turbo, Snap, Rapid; Drop x Strobe with dark gaps and saturated hits; one-bar Flash Fill then automatic Drop. Intro/Groove/Transition/Build/Pre-Drop/Drop/Breakdown/Outro now use beat-gated contrast with actual black RGB pauses instead of sustained pads. Updated 8/16-bar buildup at selected BPM, independent BLE lamps preserved. Warning photosensitivity; physical light timing may vary."
          fi
