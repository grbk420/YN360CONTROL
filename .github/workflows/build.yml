name: Build YN360 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unseal persistent signing key
        env:
          YN360_SIGNING_PASSWORD: ${{ secrets.YN360_SIGNING_PASSWORD }}
        run: |
          test -n "$YN360_SIGNING_PASSWORD" || { echo "::error::Add the YN360_SIGNING_PASSWORD repository secret before building."; exit 1; }
          base64 --decode signing/yn360-release.p12.enc.b64 > /tmp/yn360-release.p12.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in /tmp/yn360-release.p12.enc -out /tmp/yn360-release.p12 -pass env:YN360_SIGNING_PASSWORD
          chmod 600 /tmp/yn360-release.p12
          echo "YN360_KEYSTORE_PATH=/tmp/yn360-release.p12" >> "$GITHUB_ENV"
      - name: Build stable signed release
        working-directory: source
        env:
          YN360_SIGNING_PASSWORD: ${{ secrets.YN360_SIGNING_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: YN360-Control-v1.11-final
          path: source/app/build/outputs/apk/release/app-release.apk
      - name: Publish FINAL v1.11 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp source/app/build/outputs/apk/release/app-release.apk YN360-Control-v1.11.apk
          if gh release view v1.11.0 >/dev/null 2>&1; then
            gh release upload v1.11.0 YN360-Control-v1.11.apk --clobber
          else
            gh release create v1.11.0 YN360-Control-v1.11.apk \
              --title "YN360 Control FINAL v1.11" \
              --notes "YN360 Studio v1.11 DJ Performance: nine live stages Intro, Groove, Transition, Build 8/16 bars, Pre-Drop, Drop Now, Breakdown and Outro. Automatically enters Drop after 8 or 16 bars in 4/4 at custom BPM; bar countdown on screen; saturated RGB pads mixed with short strobe accents. Works for each enabled lamp individually or both, respects manual ON and foreground BLE service. Photo-sensitive caution; hardware response requires lamp testing."
          fi
