name: Build YN360 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unseal persistent signing key
        env:
          YN360_SIGNING_PASSWORD: ${{ secrets.YN360_SIGNING_PASSWORD }}
        run: |
          test -n "$YN360_SIGNING_PASSWORD" || { echo "::error::Add the YN360_SIGNING_PASSWORD repository secret before building."; exit 1; }
          base64 --decode signing/yn360-release.p12.enc.b64 > /tmp/yn360-release.p12.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in /tmp/yn360-release.p12.enc -out /tmp/yn360-release.p12 -pass env:YN360_SIGNING_PASSWORD
          chmod 600 /tmp/yn360-release.p12
          echo "YN360_KEYSTORE_PATH=/tmp/yn360-release.p12" >> "$GITHUB_ENV"
      - name: Build stable signed release
        working-directory: source
        env:
          YN360_SIGNING_PASSWORD: ${{ secrets.YN360_SIGNING_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: YN360-Control-v0.7-stable
          path: source/app/build/outputs/apk/release/app-release.apk
