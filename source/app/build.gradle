plugins { id 'com.android.application' }

android {
    namespace 'com.bongobrygada.yn360control'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bongobrygada.yn360control'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.11'
    }

    signingConfigs {
        release {
            def signingPath = System.getenv('YN360_KEYSTORE_PATH')
            def signingPassword = System.getenv('YN360_SIGNING_PASSWORD')
            if (signingPath && signingPassword) {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias 'yn360'
                keyPassword signingPassword
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
